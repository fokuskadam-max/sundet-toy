<div class="videoWrap" style="position:relative">
    <!-- БАЛАНЫҢ ФОТОСЫ БІРІНШІ ШЫҒАДЫ -->
    <img src="photo.jpg" id="mainPhoto" style="width:100%;display:block;border-radius:16px;cursor:pointer" onclick="playVideo()">
    <!-- ВИДЕО АСТЫНДА ЖАСЫРЫН ТҰРАДЫ -->
    <video id="mainVideo" loop playsinline controls style="width:100%;display:none;border-radius:16px">
      <source src="video.mp4" type="video/mp4">
    </video>
    <div id="playBtn" onclick="playVideo()" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:rgba(255,255,255,0.9);border-radius:50%;display:grid;place-items:center;font-size:30px;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,0.3)">▶️</div>
</div>

<script>
function playVideo(){
  document.getElementById('mainPhoto').style.display='none';
  document.getElementById('playBtn').style.display='none';
  let v=document.getElementById('mainVideo');
  v.style.display='block';
  v.play();
}
</script>
